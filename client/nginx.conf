# SPA runtime config for the client nginx container.
# Listens on IPv4 0.0.0.0:5173 to match the HEALTHCHECK and the client's
# conventional dev-server port. SPA fallback to index.html for client-side
# routing.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
