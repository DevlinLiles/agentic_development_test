services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chessmvp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChessMvp!Local2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - chessmvp-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chessmvp-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__ChessMvpDb: "Server=sqlserver,1433;Database=ChessMvp;User Id=sa;Password=ChessMvp!Local2026;TrustServerCertificate=True"
      Cors__ClientOrigin: "http://localhost:5173"
    ports:
      - "5112:5112"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      # The API exposes its OpenAPI document at /openapi/v1.json in Development.
      test: ["CMD", "curl", "--fail", "http://localhost:5112/openapi/v1.json"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5112"
        VITE_HUB_URL: "http://localhost:5112/hubs/game"
    container_name: chessmvp-client
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  chessmvp-sqldata:
