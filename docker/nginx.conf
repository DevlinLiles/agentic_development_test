# Static SPA host for the ChessMvp client.
# `listen 80` binds IPv4 0.0.0.0:80 — the compose HEALTHCHECK targets
# http://127.0.0.1:80/ so the check's host/port matches this exactly.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
